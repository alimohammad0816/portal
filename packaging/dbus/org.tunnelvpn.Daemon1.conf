<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed to /usr/share/dbus-1/system.d/. Anyone may talk to the
     daemon; it checks polkit before anything privileged. -->
<busconfig>
  <policy user="root">
    <allow own="org.tunnelvpn.Daemon1"/>
    <allow send_destination="org.tunnelvpn.Daemon1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.tunnelvpn.Daemon1" send_interface="org.tunnelvpn.Daemon1"/>
    <allow send_destination="org.tunnelvpn.Daemon1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.tunnelvpn.Daemon1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.tunnelvpn.Daemon1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
