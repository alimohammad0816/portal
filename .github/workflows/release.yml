name: Release

# Push a tag like v0.2.0 (scripts/release.sh does it) to build, test, sign
# and publish the Linux packages. Installed apps find them through the
# GitHub Releases API.
#
#   .deb  amd64, arm64   Ubuntu 22.04+, Debian 12+, Mint, Pop!_OS
#   .rpm  x86_64, aarch64  Fedora, openSUSE Tumbleweed
#   .pkg.tar.zst  x86_64  Arch, Manjaro, EndeavourOS (+ its PKGBUILD)
#
# Every package is installed in a fresh container of each distro first;
# nothing is published unless all of them pass. Pushes to main that touch
# packaging run the same build and tests without publishing.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "apps/desktop/src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the packages run on newer systems.
          - { arch: amd64, rpm_arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, rpm_arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      # Baked into the app so it knows where to look for updates.
      PORTAL_UPDATE_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $v in Cargo.toml"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Test
        run: cargo test --workspace --locked

      - name: Build daemon and CLI
        run: cargo build --release --locked -p portald -p portal-cli

      - name: Build app, .deb and .rpm
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles deb,rpm

      - name: Collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb "out/portal_${VERSION}_${{ matrix.arch }}.deb"
          cp target/release/bundle/rpm/*.rpm "out/portal-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          dpkg-deb --field out/*.deb Package Version Architecture Depends
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  arch:
    name: Build (Arch)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages-amd64
          path: in

      - name: makepkg
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p arch out
          deb="portal_${VERSION}_amd64.deb"
          cp "in/$deb" packaging/arch/portal.install arch/
          sum=$(sha256sum "in/$deb" | cut -d' ' -f1)
          sed -e "s|@VERSION@|$VERSION|" -e "s|@SHA256@|$sum|" -e "s|@REPO@|$REPO|g" \
            packaging/arch/PKGBUILD.in > arch/PKGBUILD
          # makepkg uses the .deb next to the PKGBUILD instead of downloading it.
          docker run --rm -v "$PWD/arch:/pkg" archlinux:base-devel sh -ec '
            useradd -m builder
            chown -R builder /pkg
            su builder -c "cd /pkg && makepkg --nodeps --noconfirm"
          '
          cp arch/*.pkg.tar.zst arch/PKGBUILD arch/portal.install out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: out/*
          if-no-files-found: error

  test:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: [build, arch]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, image: "ubuntu:22.04", kind: deb, artifact: packages-amd64 }
          - { arch: amd64, image: "ubuntu:24.04", kind: deb, artifact: packages-amd64 }
          - { arch: amd64, image: "debian:12", kind: deb, artifact: packages-amd64 }
          - { arch: amd64, image: "fedora:latest", kind: rpm, artifact: packages-amd64 }
          - { arch: amd64, image: "opensuse/tumbleweed", kind: rpm, artifact: packages-amd64 }
          - { arch: amd64, image: "archlinux:latest", kind: arch, artifact: packages-arch }
          - { arch: arm64, image: "ubuntu:24.04", kind: deb, artifact: packages-arm64 }
          - { arch: arm64, image: "fedora:latest", kind: rpm, artifact: packages-arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkgs

      - name: Install and check
        run: |
          case "${{ matrix.kind }}" in
            deb) pkg=$(ls pkgs/*.deb) ;;
            rpm) pkg=$(ls pkgs/*.rpm) ;;
            arch) pkg=$(ls pkgs/*.pkg.tar.zst) ;;
          esac
          cp packaging/ci/install-test.sh pkgs/
          if ! docker run --rm -v "$PWD/pkgs:/pkgs" -w /pkgs "${{ matrix.image }}" \
              sh ./install-test.sh "${{ matrix.kind }}" "$(basename "$pkg")" > log.txt 2>&1; then
            cat log.txt
            # Annotations are readable without signing in, unlike job logs.
            msg=$(tail -n 25 log.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Install failed on ${{ matrix.image }} (${{ matrix.arch }})::$msg"
            exit 1
          fi
          cat log.txt

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: out
          merge-multiple: true

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l out
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            # Still downloadable and installable by hand; installed apps
            # only offer signed releases, so this one won't auto-update.
            echo "::warning::No MINISIGN_SECRET_KEY secret: publishing unsigned packages that the in-app updater will skip (see README, Releases)."
            (cd out && sha256sum * > SHA256SUMS)
            exit 0
          fi
          # Ubuntu 22.04 doesn't package minisign; use the official build.
          url=https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          curl -fsSL "$url" -o "$RUNNER_TEMP/minisign.tar.gz"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          minisign="$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in out/*.deb out/*.rpm out/*.pkg.tar.zst; do
            "$minisign" -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "portal $VERSION $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          for f in out/*.deb out/*.rpm out/*.pkg.tar.zst; do
            "$minisign" -V -p packaging/update-key.pub -m "$f"
          done
          (cd out && sha256sum * > SHA256SUMS)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Portal ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: out/*
