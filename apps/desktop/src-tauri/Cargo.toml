[package]
name = "portal-desktop"
description = "Portal desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "portal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
portal-core.workspace = true
anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
